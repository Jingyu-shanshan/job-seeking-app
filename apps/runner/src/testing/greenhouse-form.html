<!doctype html>
<!--
  A made-up application form with the markup of Greenhouse's hosted forms as they were on
  2026-10-07: plain inputs with a `<id>-label`, file inputs in a labelled group, searchable selects
  (`.select__container`, options `react-select-<id>-option-<n>`), a checkbox group, the location
  search, the self-identification and demographic sections, and a consent. The script at the end
  stands in for Greenhouse's own: it makes the selects searchable. The options are made up and
  given in `data-options`, which Greenhouse's pages do not have.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Application for Platform Engineer at Example Oy</title>
    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      .select__menu {
        border: 1px solid #999;
      }
      .select__option {
        padding: 4px;
        cursor: pointer;
      }
      .checkbox__input input {
        opacity: 0;
        position: absolute;
      }
    </style>
  </head>
  <body>
    <h1>Platform Engineer</h1>
    <form method="get" action="/embed/job_app" id="application-form" class="application--form">
      <div class="application--questions">
        <div class="field-wrapper">
          <label id="first_name-label" for="first_name" class="label"
            >First Name<span aria-hidden="true">*</span></label
          >
          <input
            id="first_name"
            class="input input__single-line"
            aria-label="First Name"
            aria-required="true"
            type="text"
            value=""
          />
        </div>
        <div class="field-wrapper">
          <label id="last_name-label" for="last_name" class="label"
            >Last Name<span aria-hidden="true">*</span></label
          >
          <input
            id="last_name"
            class="input input__single-line"
            aria-label="Last Name"
            aria-required="true"
            type="text"
            value=""
          />
        </div>
        <div class="field-wrapper">
          <label id="email-label" for="email" class="label"
            >Email<span aria-hidden="true">*</span></label
          >
          <input
            id="email"
            class="input input__single-line"
            aria-label="Email"
            aria-required="true"
            type="text"
            value=""
          />
        </div>
        <fieldset class="phone-input">
          <legend class="visually-hidden">Phone</legend>
          <div class="select">
            <div class="select__container" data-options='["Finland +358","Sweden +46"]'>
              <label id="country-label" for="country" class="label select__label"
                >Country<span aria-hidden="true">*</span></label
              >
              <div class="select-shell">
                <div class="select__control">
                  <div class="select__value-container">
                    <div class="select__placeholder" id="react-select-country-placeholder">
                      Select...
                    </div>
                    <div class="select__input-container">
                      <input
                        class="select__input"
                        id="country"
                        type="text"
                        role="combobox"
                        aria-expanded="false"
                        aria-labelledby="country-label"
                        aria-required="true"
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
              <input required="" tabindex="-1" aria-hidden="true" value="" />
            </div>
          </div>
          <label id="phone-label" for="phone" class="label">Phone</label>
          <input
            id="phone"
            class="input input__single-line"
            aria-label="Phone"
            aria-required="false"
            type="tel"
          />
        </fieldset>
        <div class="field-wrapper">
          <div
            role="group"
            aria-labelledby="upload-label-resume"
            aria-required="true"
            class="file-upload"
          >
            <div id="upload-label-resume" class="label upload-label">
              Resume/CV<span class="required">*</span>
            </div>
            <div class="file-upload__wrapper">
              <button type="button" class="btn btn--pill">Attach</button>
              <label class="visually-hidden" for="resume">Attach</label>
              <input
                id="resume"
                class="visually-hidden"
                type="file"
                accept=".pdf,.doc,.docx,.txt,.rtf"
              />
              <p class="file-upload__filetypes">Accepted file types: pdf, doc, docx, txt, rtf</p>
            </div>
          </div>
        </div>
        <div class="field-wrapper">
          <div
            role="group"
            aria-labelledby="upload-label-cover_letter"
            aria-required="false"
            class="file-upload"
          >
            <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
            <div class="file-upload__wrapper">
              <button type="button" class="btn btn--pill">Attach</button>
              <label class="visually-hidden" for="cover_letter">Attach</label>
              <input
                id="cover_letter"
                class="visually-hidden"
                type="file"
                accept=".pdf,.doc,.docx,.txt,.rtf"
              />
            </div>
          </div>
        </div>
        <div class="field-wrapper">
          <div class="select">
            <div
              class="select__container"
              data-options-search="Helsinki, Uusimaa, Finland|Helsinki|Helsingborg, Sweden"
            >
              <label
                id="candidate-location-label"
                for="candidate-location"
                class="label select__label"
                >Location (City)<span aria-hidden="true">*</span></label
              >
              <div class="select-shell">
                <div class="select__control">
                  <div class="select__value-container">
                    <div
                      class="select__placeholder"
                      id="react-select-candidate-location-placeholder"
                    ></div>
                    <div class="select__input-container">
                      <input
                        class="select__input"
                        id="candidate-location"
                        type="text"
                        role="combobox"
                        aria-expanded="false"
                        aria-labelledby="candidate-location-label"
                        aria-required="true"
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
              <input required="" tabindex="-1" aria-hidden="true" value="" />
            </div>
          </div>
        </div>
      </div>
      <div class="application--questions">
        <div class="field-wrapper">
          <label id="question_101-label" for="question_101" class="label">LinkedIn Profile</label>
          <input
            id="question_101"
            class="input input__single-line"
            aria-label="LinkedIn Profile"
            aria-required="false"
            type="text"
            value=""
          />
        </div>
        <div class="field-wrapper">
          <div class="select">
            <div class="select__container" data-options='["Yes","No"]'>
              <label id="question_102-label" for="question_102" class="label select__label"
                >Will you now or in the future require sponsorship for a visa?<span
                  aria-hidden="true"
                  >*</span
                ></label
              >
              <div class="select-shell">
                <div class="select__control">
                  <div class="select__value-container">
                    <div class="select__placeholder" id="react-select-question_102-placeholder">
                      Select...
                    </div>
                    <div class="select__input-container">
                      <input
                        class="select__input"
                        id="question_102"
                        type="text"
                        role="combobox"
                        aria-expanded="false"
                        aria-labelledby="question_102-label"
                        aria-required="true"
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
              <input required="" tabindex="-1" aria-hidden="true" value="" />
            </div>
          </div>
        </div>
        <div class="field-wrapper">
          <label id="question_103-label" for="question_103" class="label"
            >What is your notice period?<span aria-hidden="true">*</span></label
          >
          <textarea
            id="question_103"
            class="input input__multi-line"
            aria-label="What is your notice period?"
            aria-required="true"
          ></textarea>
        </div>
        <div class="field-wrapper">
          <fieldset class="checkbox" id="question_104[]" aria-required="true">
            <legend class="label checkbox__description">
              Which countries could you work in? <span class="required">*</span>
            </legend>
            <div class="checkbox__wrapper">
              <div class="checkbox__input">
                <input type="checkbox" id="question_104[]_1" name="question_104[]" value="1" />
                <label for="question_104[]_1">Finland</label>
              </div>
            </div>
            <div class="checkbox__wrapper">
              <div class="checkbox__input">
                <input type="checkbox" id="question_104[]_2" name="question_104[]" value="2" />
                <label for="question_104[]_2">Sweden</label>
              </div>
            </div>
            <div class="checkbox__wrapper">
              <div class="checkbox__input">
                <input type="checkbox" id="question_104[]_3" name="question_104[]" value="3" />
                <label for="question_104[]_3">Estonia</label>
              </div>
            </div>
          </fieldset>
        </div>
        <div class="field-wrapper">
          <div class="select">
            <div
              class="select__container"
              data-options='["English","Finnish","Swedish"]'
              data-multi="true"
            >
              <label id="question_105[]-label" for="question_105[]" class="label select__label"
                >Which languages do you speak fluently?<span aria-hidden="true">*</span></label
              >
              <div class="select-shell">
                <div class="select__control">
                  <div class="select__value-container">
                    <div class="select__placeholder" id="react-select-question_105[]-placeholder">
                      Select...
                    </div>
                    <div class="select__input-container">
                      <input
                        class="select__input"
                        id="question_105[]"
                        type="text"
                        role="combobox"
                        aria-expanded="false"
                        aria-labelledby="question_105[]-label"
                        aria-required="true"
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
              <input required="" tabindex="-1" aria-hidden="true" value="" />
            </div>
          </div>
        </div>
      </div>
      <div class="eeoc__container">
        <h2 class="section-header">Voluntary Self-Identification</h2>
        <div class="eeoc__question__wrapper">
          <div class="select">
            <div
              class="select__container"
              data-options='["Decline To Self Identify","Female","Male"]'
            >
              <label id="gender-label" for="gender" class="label select__label">Gender</label>
              <div class="select-shell">
                <div class="select__control">
                  <div class="select__value-container">
                    <div class="select__placeholder" id="react-select-gender-placeholder">
                      Select...
                    </div>
                    <div class="select__input-container">
                      <input
                        class="select__input"
                        id="gender"
                        type="text"
                        role="combobox"
                        aria-expanded="false"
                        aria-labelledby="gender-label"
                        aria-required="false"
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="demographic-section" class="demographic--container">
        <h3 class="section-header">Voluntary demographic questions</h3>
        <div class="select">
          <div class="select__container" data-options='["I prefer not to answer","Yes","No"]'>
            <label id="4001-label" for="4001" class="label select__label"
              >Do you identify as a member of an under-represented group?</label
            >
            <div class="select-shell">
              <div class="select__control">
                <div class="select__value-container">
                  <div class="select__placeholder" id="react-select-4001-placeholder">
                    Select...
                  </div>
                  <div class="select__input-container">
                    <input
                      class="select__input"
                      id="4001"
                      type="text"
                      role="combobox"
                      aria-expanded="false"
                      aria-labelledby="4001-label"
                      aria-required="false"
                      value=""
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="field-wrapper">
        <div class="checkbox__input">
          <input type="checkbox" id="gdpr_processing_consent_given" aria-required="true" />
          <label for="gdpr_processing_consent_given"
            >I agree that Example Oy processes my data for this application.<span aria-hidden="true"
              >*</span
            ></label
          >
        </div>
      </div>
      <div class="application--submit">
        <button type="submit" class="btn btn--pill">Submit application</button>
      </div>
    </form>
    <div class="grecaptcha-badge">
      <iframe title="reCAPTCHA" src="about:blank" width="256" height="60"></iframe>
    </div>
    <script>
      // Stands in for Greenhouse's own script, which takes the server-rendered form over a moment
      // after the page loads (React hydration): until then the selects do nothing, and then text
      // typed in early is gone and every input carries React's mark; the selects start working a
      // moment later still. Afterwards typing in a select
      // shows the options that contain the text and clicking one chooses it (location options come
      // after a delay, as a search does), and attaching a file replaces the input with its name.
      setTimeout(() => {
        for (const field of document.querySelectorAll('#application-form input, textarea')) {
          if (field.type !== 'checkbox' && field.type !== 'file') field.value = '';
          field.__reactFiber$fixture = {};
        }
        // The selects start working a little after the mark, as on Greenhouse's pages.
        setTimeout(live, 600);
      }, 1000);
      const live = () => {
        for (const group of document.querySelectorAll('.file-upload')) {
          const input = group.querySelector('input[type=file]');
          input.addEventListener('change', () => {
            const shown = document.createElement('div');
            shown.className = 'file-upload__filename';
            shown.innerHTML =
              '<p class="body body__secondary"></p><button type="button" aria-label="Remove file"></button>';
            shown.firstChild.textContent = input.files[0].name;
            group.querySelector('.file-upload__wrapper').replaceChildren(shown);
          });
        }
        for (const container of document.querySelectorAll('.select__container')) {
          const input = container.querySelector('.select__input');
          const shell = container.querySelector('.select-shell');
          const values = container.querySelector('.select__value-container');
          const multi = container.dataset.multi === 'true';
          const search = container.dataset.optionsSearch;
          const all = search ? search.split('|') : JSON.parse(container.dataset.options);
          let menu;
          const close = () => {
            menu?.remove();
            menu = undefined;
            input.setAttribute('aria-expanded', 'false');
          };
          const choose = (label) => {
            values.querySelector('.select__placeholder')?.remove();
            // The stand-in that makes the browser require a value has one now.
            const standIn = container.querySelector('input[aria-hidden="true"]');
            if (standIn) standIn.value = label;
            if (multi) {
              const chip = document.createElement('div');
              chip.className = 'select__multi-value';
              chip.innerHTML = '<div class="select__multi-value__label"></div>';
              chip.firstChild.textContent = label;
              values.insertBefore(chip, values.querySelector('.select__input-container'));
            } else {
              values.querySelector('.select__single-value')?.remove();
              const single = document.createElement('div');
              single.className = 'select__single-value';
              single.textContent = label;
              values.insertBefore(single, values.querySelector('.select__input-container'));
            }
            input.value = '';
            close();
          };
          const open = () => {
            close();
            const text = input.value.toLowerCase();
            const shown = all.filter((label) => label.toLowerCase().includes(text));
            menu = document.createElement('div');
            menu.className = 'select__menu';
            const list = document.createElement('div');
            list.className = 'select__menu-list';
            list.setAttribute('role', 'listbox');
            shown.forEach((label, i) => {
              const option = document.createElement('div');
              option.className = 'select__option';
              option.id = `react-select-${input.id}-option-${i}`;
              option.textContent = label;
              option.addEventListener('click', () => choose(label));
              list.append(option);
            });
            menu.append(list);
            shell.append(menu);
            input.setAttribute('aria-expanded', 'true');
          };
          input.addEventListener('input', () => (search ? setTimeout(open, 300) : open()));
          input.addEventListener('blur', () => setTimeout(close, 200));
        }
      };
      // As Greenhouse's script does on Submit: the application goes in a request of its own, and
      // the page moves to the confirmation page. With `data-after-submit` on the body the answer
      // asks for the security code Greenhouse emailed instead (the next Submit with the code typed
      // in goes through), or nothing more happens.
      document.getElementById('application-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        document.body.dataset.submitted = 'yes';
        await fetch('/embed/job_app/made-up-submit', { method: 'POST', body: '' });
        const code = [...document.querySelectorAll('input[id^="security-input-"]')];
        const after = document.body.dataset.afterSubmit;
        if (after === 'security-code' && !(code.length && code.every((input) => input.value))) {
          if (code.length) return;
          const box = document.createElement('div');
          box.className = 'email-verification';
          box.innerHTML =
            '<label id="email-verification-label" for="security-input-0">Security code</label>';
          for (let i = 0; i < 8; i++) {
            const input = document.createElement('input');
            input.id = `security-input-${i}`;
            input.type = 'text';
            input.maxLength = 1;
            box.append(input);
          }
          document.querySelector('.application--submit').before(box);
          return;
        }
        if (after === 'nothing') return;
        location.assign(`/embed/job_app/confirmation${location.search}`);
      });
    </script>
  </body>
</html>
